on:
  workflow_dispatch:

jobs:
  # 1. Hybrid Job
  hybrid_job:
    runs-on: ubuntu-latest
    steps:
      - name: Run on VM
        run: echo "this is vm"

      - name: Run inside Alpine
        uses: docker://alpine:latest
        with:
          entrypoint: /bin/sh
          args: -c "echo 'this is alpine'"

      - name: Back to VM
        run: echo "back to vm"

  # 2. Entire Job inside public Node image
  dockerized_job:
    runs-on: ubuntu-latest
    container: node:20
    steps:
      - run: node --version
      - run: echo "inside node image"

  # 3. Entire Job inside private image
  dockerized_job_priv:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/my-org/my-private-image:latest
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - run: node --version
      - run: echo "inside private image"








