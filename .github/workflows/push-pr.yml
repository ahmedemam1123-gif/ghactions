
on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "src/**"
      - "test/**"

  pull_request:
    branches:
      - main
      - release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6.1.0
      - name: run-test
        run: npm test
